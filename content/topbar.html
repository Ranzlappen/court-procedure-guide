
<!-- =====================================================================
     APP BAR — persistent orientation strip (drawer toggle, brand,
     current phase readout, search). Fixed at every breakpoint.
     ===================================================================== -->
<header class="appbar">
  <button class="appbar-btn nav-toggle" id="sidebarToggle" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation menu">
    <span aria-hidden="true">&#9776;</span>
  </button>

  <a class="appbar-brand" href="#phase1">
    <span class="mark" aria-hidden="true">&#9878;&#65039;</span>
    <span class="name">Court Guide</span>
  </a>

  <div class="appbar-where">
    <span class="appbar-kicker" id="appbarKicker">Phase 1 of 5</span>
    <span class="appbar-phase" id="appbarPhase">Case Initiation</span>
  </div>

  <div class="appbar-search">
    <div class="search-bar" id="searchBarDesktop">
      <label class="visually-hidden" for="searchInput">Search the guide</label>
      <input type="search" id="searchInput" placeholder="Search the guide&hellip;" autocomplete="off">
      <span class="search-count" id="searchCount" aria-live="polite"></span>
      <button class="clear-search" id="clearSearch" type="button" aria-label="Clear search">&times;</button>
    </div>
  </div>
</header>
