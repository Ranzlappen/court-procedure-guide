
<!-- =====================================================================
     GLOSSARY
     ===================================================================== -->
<div class="phase phase-tab" id="glossary">
<div class="phase-card phase-card--top">
  <header class="phase-tab-header">
    <span class="icon" aria-hidden="true">&#128214;</span>
    <div>
      <p class="phase-num">Reference</p>
      <h2 class="label">Legal Glossary</h2>
    </div>
  </header>
  <div class="phase-body phase-body--static">
    <div class="phase-body-inner">

      <p>Any <span class="term" style="cursor:default;">highlighted term</span> in the guide opens its definition. Every term is listed here too.</p>

      <div class="glossary-tools">
        <div class="search-bar" id="glossaryFilterBar">
          <label class="visually-hidden" for="glossaryFilter">Filter glossary terms</label>
          <input type="search" id="glossaryFilter" placeholder="Filter terms&hellip;" autocomplete="off">
          <button class="clear-search" id="glossaryFilterClear" type="button" aria-label="Clear filter">&times;</button>
        </div>
      </div>

      <dl class="glossary-list" id="glossaryList">
        <!-- Populated by js/glossary-ui.js -->
      </dl>
      <p class="glossary-empty" id="glossaryEmpty" hidden>No terms match that filter.</p>

    </div>
  </div>
</div>
</div>
