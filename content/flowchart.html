
<!-- =====================================================================
     CASE FLOW MAP — jump to any stage; reflows to a vertical stack on
     narrow screens instead of shrinking to unreadable text.
     ===================================================================== -->
<details class="flowmap" id="flowmap" open>
  <summary><span aria-hidden="true">&#128506;&#65039;</span> Case flow &mdash; tap a stage to jump</summary>
  <div class="flowmap-body">
    <ol class="flowmap-track">
      <li class="fc-step">
        <button type="button" class="fc-node fc-active" data-phase="phase1">
          <span class="fc-num">Phase 1</span>
          <span class="fc-name">Case Filing</span>
          <span class="fc-sub">Charges or complaint filed; first appearance</span>
        </button>
      </li>
      <li class="fc-link" aria-hidden="true"></li>
      <li class="fc-step">
        <button type="button" class="fc-node" data-phase="phase2">
          <span class="fc-num">Phase 2</span>
          <span class="fc-name">Pre-Trial</span>
          <span class="fc-sub">Arraignment, discovery, motions, plea talks</span>
        </button>
      </li>
      <li class="fc-link" aria-hidden="true"></li>
      <li class="fc-step">
        <button type="button" class="fc-node" data-phase="phase3">
          <span class="fc-num">Phase 3</span>
          <span class="fc-name">Trial</span>
          <span class="fc-sub">Jury selection through verdict</span>
        </button>
      </li>
      <li class="fc-link" aria-hidden="true"></li>
      <li class="fc-step">
        <button type="button" class="fc-node" data-phase="phase4">
          <span class="fc-num">Phase 4</span>
          <span class="fc-name">Resolution</span>
          <span class="fc-sub">Sentencing or civil judgment</span>
        </button>
      </li>
      <li class="fc-link" aria-hidden="true"></li>
      <li class="fc-step">
        <button type="button" class="fc-node" data-phase="phase5">
          <span class="fc-num">Phase 5</span>
          <span class="fc-name">Appeals</span>
          <span class="fc-sub">Review for legal error by a higher court</span>
        </button>
      </li>
    </ol>

    <p class="fc-branch">
      <span><b>Branches:</b></span>
      <span>Plea deal accepted &rarr; skips Trial, straight to Resolution.</span>
      <span>Not guilty verdict &rarr; case ends, no sentencing.</span>
      <span>Guilty verdict &rarr; Resolution, then Appeals.</span>
    </p>
  </div>
</details>
